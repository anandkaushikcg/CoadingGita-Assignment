<!DOCTYPE html>
<html>
<head>
    <title>Responsive Video Player</title>

    <style>
        .video {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Responsive Video Player</h2>

    <div class="video">
        <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Responsive Video"
            allow="fullscreen; gyroscope"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
