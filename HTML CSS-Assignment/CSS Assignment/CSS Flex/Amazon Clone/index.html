<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon</title>
  <link href="https://fonts.cdnfonts.com/css/amazon-ember" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="top-bar">
            <a href="https://www.amazon.in" target="_self" id="logo">
                <img src="Assets/logo.png" alt="amazon logo">
            </a>
            <div id="location">
                <img src="Assets/location.png" alt="location">
                <div>
                    <h4>Hello</h4>
                    <h3>Select your address</h3>
                </div>
            </div>
            <div id="search-bar">
                <select name="all">
                    <option value="all">All</option>
                </select>
                <input type="search" name="search">
                <button type="submit">
                    <img src="Assets/search icon.png" alt="search">
                </button>
            </div>
            <button>
                    <img src="Assets/indian flag.png" alt="indian flag">
                    <img src="Assets/down arrow.png" alt="indian down">
            </button>
            <button>
                <div>
                    <h3>Hello, Sign in</h3>
                    <h3>Account & Lists</h3>
                </div>
                <img src="Assets/down arrow.png" alt="down">
            </button>
            <button>
                Returns & Orders
            </button>
            <button>
                <img src="Assets/cart icon.png" alt="cart">
                <h3>Cart</h3>
            </button>
        </div>
        <nav>
            <ul>
                <li><img src="Assets/ham burger icon.png" alt="hamburger">All</li>
                <li>Best Sellers</li>
                <li>Mobiles</li>
                <li>Customer Service</li>
                <li>Today's Deals</li>
                <li>Fashion</li>
                <li>Electronics</li>
                <li>Books</li>
                <li>Prime <img src="Assets/down arrow.png" alt="down"></li>
                <li>New Releases</li>
                <li>Home & Kitchen</li>
                <li>Amazon Pay</li>
            </ul>
            <img src="Assets/lion.png" alt="lion">
            <div>
                <h2>prime day</h2>
                <div><img src="Assets/amazon design.png" alt="amazon design">23<sup>rd</sup>-24<sup>th</sup>July</div>
            </div>
        </nav>
    </header>
</body>
</html>
